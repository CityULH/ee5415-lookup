const META = {"uupdated": "2026-10-11 08:01", "umonth": "2026-10"};
const QUOTA = 150000000;
const ITER = 200000;
const enc = new TextEncoder();

async function sha256(bytes) {
  return new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
}
async function derivePad(sid, salt, len) {
  const km = await crypto.subtle.importKey("raw", enc.encode(sid), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits(
    { name: "PBKDF2", hash: "SHA-256", salt: salt, iterations: ITER }, km, len * 8));
}
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = b => btoa(String.fromCharCode(...b));
const eq = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);

let currentKey = "";
async function lookup() {
  const sid = document.getElementById("sid").value.trim();
  const msg = document.getElementById("msg");
  const btn = document.getElementById("go");
  msg.className = "msg"; msg.style.display = "none";
  document.getElementById("result").style.display = "none";
  if (!/^\d{6,12}$/.test(sid)) {
    msg.textContent = "请输入正确的学号（纯数字）。";
    msg.className = "msg err"; return;
  }
  btn.disabled = true; btn.textContent = "解密中…";
  try {
    let hit = null, pad = null;
    for (const r of DATA) {
      const salt = b64(r.s);
      const h = (await sha256(concat(salt, enc.encode(sid)))).slice(0, 16);
      if (eq(h, b64(r.h))) { hit = r; pad = await derivePad(sid, salt, b64(r.c).length); break; }
    }
    if (!hit) {
      msg.textContent = "未找到该学号，请确认是否在 EE5415 名单内；如确认无误请联系老师。";
      msg.className = "msg err"; return;
    }
    const ct = b64(hit.c);
    currentKey = String.fromCharCode(...ct.map((b, i) => b ^ pad[i]));
    document.getElementById("who").textContent = "✅ 已验证：" + (hit.n ? "这是 " + hit.n + " 同学的 Key" : "这是你的 Key");
    document.getElementById("key").textContent = currentKey;
    document.getElementById("result").style.display = "block";
    renderUsage(sid, hit);
  } finally {
    btn.disabled = false; btn.textContent = "查询";
  }
}
function concat(a, b) { const r = new Uint8Array(a.length + b.length); r.set(a); r.set(b, a.length); return r; }
function fmt(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return String(n);
}
async function renderUsage(sid, hit) {
  const box = document.getElementById("usage");
  if (!hit.us) { box.style.display = "none"; return; }
  try {
    const salt = b64(hit.us), ct = b64(hit.uc);
    const pad = await derivePad(sid + "#usage", salt, ct.length);
    const u = JSON.parse(String.fromCharCode(...ct.map((b, i) => b ^ pad[i])));
    const quota = hit.q || QUOTA;
    const pct = Math.min(u.total / quota * 100, 100);
    const fill = document.getElementById("u-fill");
    fill.style.width = Math.max(pct, 1.5) + "%";
    fill.className = "fill" + (pct >= 90 ? " hot" : pct >= 70 ? " warn" : "");
    document.getElementById("u-updated").textContent = "数据截至 " + (META.uupdated || "—") + " · 每日更新";
    document.getElementById("u-nums").innerHTML =
      "已用 <b>" + fmt(u.total) + "</b> / " + fmt(quota) + " tokens（" + pct.toFixed(1) + "%）· 剩余 " + fmt(Math.max(quota - u.total, 0)) +
      "<br>输入 " + fmt(u.input) + " · 输出 " + fmt(u.output) + (u.cache ? " · 缓存命中 " + fmt(u.cache) : "");
    box.style.display = "block";
  } catch (e) { box.style.display = "none"; }
}
async function copyKey() {
  try { await navigator.clipboard.writeText(currentKey); }
  catch (e) {
    const t = document.createElement("textarea"); t.value = currentKey;
    document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove();
  }
  const b = document.querySelector(".copy"); b.textContent = "已复制 ✓";
  setTimeout(() => b.textContent = "复制", 1500);
}
document.getElementById("sid").addEventListener("keydown", e => { if (e.key === "Enter") lookup(); });
